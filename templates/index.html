<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E-Health Voice Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <main class="app">

    <header class="topbar">
      <span class="brand">E-Health</span>
      <div class="topbar-right">
        <a href="{{ url_for('history_page') }}" class="chip" id="history-link">History</a>
        <span class="username">{{ username }}</span>
        <a href="{{ url_for('logout') }}" class="logout-link" id="logout-link">Log out</a>
        <div class="lang-pill">
          <select id="language" aria-label="Choose language">
            <option value="lug">Luganda</option>
            <option value="eng">English</option>
            <option value="ach">Acholi</option>
            <option value="teo">Ateso</option>
            <option value="nyn">Runyankole</option>
            <option value="lgg">Lugbara</option>
          </select>
        </div>
      </div>
    </header>

    <section class="hero">
      <h1><span id="tagline-1">Ask about your health,</span><br><span id="tagline-2">out loud.</span></h1>
      <p class="hero-sub" id="hero-sub">Speak in your language. Get an answer you can hear and read.</p>
    </section>

    <section id="result" class="result hidden">
      <p id="transcript" class="transcript"></p>
      <p id="answer" class="answer"></p>
      <audio id="player" controls></audio>
    </section>

    <section class="chips-row" aria-label="Common topics">
      {% for intent in intents %}
      <button class="chip" data-intent="{{ intent.id }}">{{ intent.label_en }}</button>
      {% endfor %}
    </section>

    <section class="facilities-section" aria-label="Nearby health facilities">
      <div class="facilities-header">
        <h2 id="facilities-title">Nearby Health Facilities</h2>
        <button id="find-facilities-btn" class="control-btn start-btn facilities-find-btn">Find near me</button>
      </div>
      <p id="facilities-hint" class="hero-sub">Uses your device location to find the closest public hospitals.</p>
      <div id="facilities-list" class="facilities-list"></div>
    </section>

    <section class="mic-section">
      <div class="mic-wrap">
        <div id="mic-indicator" class="mic-indicator" aria-hidden="true">
          <span id="mic-icon">🎙</span>
        </div>
      </div>
      <div class="mic-controls">
        <button id="start-btn" class="control-btn start-btn">Start</button>
        <button id="stop-btn" class="control-btn stop-btn" disabled>Stop</button>
      </div>
      <p id="status-text">Press Start and speak</p>
    </section>

  </main>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
